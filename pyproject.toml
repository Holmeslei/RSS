[project]
name = "rss-pipeline"
version = "0.1.0"
description = "Personal literature recommendation RSS pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rss-pipeline = "rss_pipeline.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
